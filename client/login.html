<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game store - Login</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 28px; }
    form { display: flex; flex-direction: column; gap: 8px; }
    input, button { padding: 8px; font-size: 1rem; }
    #message { min-height: 1.4em; margin: 12px 0; }
    .error { color: #b00020; }
    .ok { color: #1b6e2d; }
  </style>
</head>
<body>
  <h1>Game store</h1>
  <div id="message"></div>

  <section id="guest-section">
    <h2>Log in</h2>
    <form id="login-form">
      <input name="username" placeholder="Username" autocomplete="username" required>
      <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>

    <h2>Sign up</h2>
    <form id="signup-form">
      <input name="username" placeholder="Username (3-30 characters)" autocomplete="username" required>
      <input name="password" type="password" placeholder="Password (at least 6 characters)" autocomplete="new-password" required>
      <button type="submit">Create account</button>
    </form>
  </section>

  <section id="user-section" hidden>
    <p id="user-info"></p>
    <button id="logout-button" type="button">Log out</button>
  </section>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
